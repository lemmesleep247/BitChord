name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"

          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file

          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool.AppImage

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Tests
        run: |
          ./gradlew \
            :shared:jvmTest \
            :desktopApp:test \
            -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew \
            :desktopApp:packageDeb \
            :desktopApp:packageRpm \
            :desktopApp:createDistributable \
            -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Verify analyser and models
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)

          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          mkdir -p dist

          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/BitChord-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect Linux packages
        run: |
          v=${{ steps.version.outputs.value }}

          mkdir -p dist

          cp \
            desktopApp/build/compose/binaries/main/deb/*.deb \
            "dist/BitChord-$v-linux-amd64.deb"

          cp \
            desktopApp/build/compose/binaries/main/rpm/*.rpm \
            "dist/BitChord-$v-linux-x86_64.rpm"

          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*


  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile wix.zip

          Expand-Archive `
            wix.zip `
            -DestinationPath "$env:RUNNER_TEMP\wix"

          "$env:RUNNER_TEMP\wix" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"

          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: |
          .\gradlew.bat `
            :shared:jvmTest `
            :desktopApp:test `
            "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and portable app
        run: |
          .\gradlew.bat `
            :desktopApp:packageMsi `
            :desktopApp:packageExe `
            :desktopApp:createDistributable `
            "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Verify analyser and models
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)

          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Collect Windows packages
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"

          New-Item `
            -ItemType Directory `
            -Force `
            dist | Out-Null

          Copy-Item `
            desktopApp/build/compose/binaries/main/msi/*.msi `
            "dist/BitChord-$v-windows-x64.msi"

          Copy-Item `
            desktopApp/build/compose/binaries/main/exe/*.exe `
            "dist/BitChord-$v-windows-x64-setup.exe"

          7z a `
            -tzip `
            -mx=5 `
            "dist/BitChord-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/BitChord/*" |
            Out-Null

          Get-ChildItem dist |
            Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*


  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Android · Signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"

          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Android $version"

      - name: Setup secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

          echo "${{ secrets.KEYSTORE_BASE64 }}" |
            base64 -d > bitchord-release.jks

          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Build signed Android APK
        run: |
          ./gradlew assembleProdRelease \
            -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Collect Android APK
        run: |
          v="${{ steps.version.outputs.value }}"

          mkdir -p dist

          apk=$(find app/build/outputs/apk/prod/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$apk" ]; then
            echo "ERROR: No APK found"
            find app/build/outputs/apk -type f -name "*.apk" -print
            exit 1
          fi

          echo "Found APK: $apk"

          cp "$apk" "dist/BitChord-$v-android.apk"

          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release
    needs:
      - linux
      - windows
      - android

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - name: List release files
        run: |
          ls -lh dist

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BitChord ${{ github.ref_name }}
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
